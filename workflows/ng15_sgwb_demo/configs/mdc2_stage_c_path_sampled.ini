# M1 task 1.6 (estimator A): MDC2 33-pulsar Stage C run with the HD<->CURN
# correlation path coordinate SAMPLED.
#
# Identical to mdc2_stage_c_hd_ridge.ini except that the overlap reduction
# function is C(eps) = (1-eps)*I + eps*C_HD with eps ~ U(0,1) instead of being
# pinned at Hellings-Downs. CURN is then the point eps=0 and HD the point eps=1
# of one posterior, so ln B(HD/CURN) is a ratio of marginal densities of a single
# scalar -- no per-model evidence, and one run instead of two.
#
# 69 sampled dims (2 GW + 2x33 noise + eps). Read the Bayes factor with
# scripts/lnb_savage_dickey.py; it reports whether the endpoint densities can be
# believed rather than only a number.
#
# Checkpointing is on: the ridge Stage C runs took ~9.5 h and this adds a
# dimension whose posterior may pile against a boundary, so a timeout is a real
# possibility and should cost hours, not the run.

[Data]
data_path = ../data/mdc2_all
excluded_psrs = __NONE__

[NUTS]
num_samples = 2000
num_warmup = 1500
num_chains = 4
target_accept_prob = 0.9
max_tree_depth = 8
dense_mass = false
dense_mass_blocks = log10_pivot_psd_prime, log10_gamma_a_prime

[PriorModel]

# 1. GW background parameters — SAMPLED
log10_ha_fixed = false
log10_ha_value = -12.5
log10_ha_min = -16.0
log10_ha_max = -9.0

log10_gamma_a_fixed = false
log10_gamma_a_value = -8.5
log10_gamma_a_min = -11.0
log10_gamma_a_max = -6.0

# Ridge GW parameterization (issue #109): sample the band-referenced pivot
# log-PSD + log10_gamma_a as independent coordinates, deriving log10_ha, to
# straighten the curved ha<->gamma_a ridge that stalled the direct-basis runs
# (one chain per run got stuck at high amplitude, r_hat 1.5-2.3). The pivot
# log-PSD range [-13,-5] brackets both the injected (~-6.3) and the direct-run
# recovered (~-9.2) values with room; pivot f = 1/(5 yr).
gw_parameterization = ridge
log10_pivot_psd_min = -13.0
log10_pivot_psd_max = -5.0
gw_pivot_freq_hz = 6.3376e-09

# Correlation path: sample eps rather than pinning the ORF at Hellings-Downs.
# A genuinely uniform prior (not the N(0,1) reparameterization the other
# parameters take) because the Bayes factor is read from the prior and posterior
# densities AT the endpoints: uniform makes the prior terms cancel, and the
# bounds keep C(eps) positive definite.
orf_path = sampled
orf_epsilon_min = 0.0
orf_epsilon_max = 1.0

# 2. Pulsar red noise — SAMPLED with empirical per-pulsar priors
spin_injections_path =
empirical_priors_path = ../data/stage_a_empirical_priors.json
empirical_prior_inflation = 2.0

log10_gamma_p_min = -12.0
log10_gamma_p_max = -6.0
log10_sigma_p_min = -20.0
log10_sigma_p_max = -12.0

# 3. EFAC/EQUAD — FIXED from MDC2 truth
noise_params_path = ../../data/IPTA_MockDataChallenge2/group1_psr_noise.json

efac_min = 0.5
efac_max = 2.0
log10_equad_min = -8.0
log10_equad_max = -6.0

[Checkpointing]
enabled = true
interval = 250
resume = false

[Logging]
level = INFO
enable_file_logging = false

[Output]
output_id = mdc2_stageC_path_sampled
base_dir = {output_id}
